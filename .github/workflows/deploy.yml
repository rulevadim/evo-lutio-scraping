name: Сборка и деплой

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Деплоить после сборки (снимите галочку для bootstrap GHCR)'
        type: boolean
        default: true

concurrency:
  # Два деплоя одновременно недопустимы, но отменять уже идущий тоже нельзя:
  # SSH-команда на ВМ продолжит работу и после отмены job.
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Как только указан хоть один permissions, остальные становятся none —
      # без явного contents:read сломается checkout.
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.value }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ref
        run: echo "value=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc # v6.11.0
        with:
          context: .
          # Раннер x86 и целевая ВМ x86 — сборка нативная, QEMU не нужен.
          platforms: linux/amd64
          push: true
          # Только SHA-тег. :latest подвержен гонке: два быстрых пуша могут
          # завершиться в обратном порядке и оставить в latest старый образ.
          tags: ${{ steps.ref.outputs.value }}
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Снятая галочка deploy — режим bootstrap: собрать и запушить образ, чтобы
    # можно было вручную сделать GHCR-пакет публичным. Новый пакет создаётся
    # приватным, и до этого анонимный `docker compose pull` на ВМ упадёт.
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Проверить, что коммит всё ещё HEAD ветки
        # SHA-тега мало: порядок постановки deploy-джобов не гарантирован, и
        # медленная старая сборка может задеплоиться после быстрой новой,
        # откатив прод. Если коммит уже не HEAD — тихо выходим.
        run: |
          git fetch origin ${{ github.ref_name }} --depth=1
          HEAD_SHA=$(git rev-parse origin/${{ github.ref_name }})
          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then
            echo "::notice::Пропускаем: ${{ github.sha }} уже не HEAD ($HEAD_SHA)"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Доставить конфиги на ВМ
        if: env.SKIP != '1'
        # Compose, Caddyfile и скрипты лежат в репозитории, но сами на ВМ не
        # попадут. Секреты (/srv/evo/.env) и текущий тег (image.env) не трогаем.
        run: |
          install -m 600 -D /dev/stdin ~/.ssh/id_deploy <<< "${{ secrets.SSH_KEY }}"
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            --exclude='.env' --exclude='image.env' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            deploy/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/evo/"
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'chmod +x /srv/evo/*.sh'
          # systemd-юниты ставятся один раз руками (см. deploy/SETUP.md): чтобы
          # деплою не требовался passwordless sudo. При их правке — переустановить.

      - name: Выкатить
        if: env.SKIP != '1'
        # deploy.sh сам проверяет healthz по HTTPS со сверкой sha и откатывается
        # на предыдущий образ при любой неудаче.
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "/srv/evo/deploy.sh '${{ needs.build.outputs.image_ref }}' '${{ github.sha }}'"
